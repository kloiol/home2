name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble & Publish APK to Releases
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure and signing keystore
        run: |
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "Error: app/src/main/AndroidManifest.xml not found."
            exit 1
          fi
          if [ ! -f "app/keystore/app-signing.jks" ]; then
            echo "Error: app/keystore/app-signing.jks not found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Signed APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HouseViewer3D-v1.1.${{ github.run_number }}.apk

      - name: Publish APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: HouseViewer3D v1.1.${{ github.run_number }}
          body: Automated Android APK build for HouseViewer3D (80 low-poly German, Kaliningrad, Polish, and Lithuanian house models; persistent signing key for in-place updates).
          make_latest: true
          files: HouseViewer3D-v1.1.${{ github.run_number }}.apk
